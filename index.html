.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1}

@media(max-width:600px){.ir,.ir.ir5{grid-template-columns:1fr 1fr}}
#gear{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;z-index:50;width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer}
#lm{position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);left:10px;z-index:50;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;min-width:180px;box-shadow:0 6px 20px rgba(0,0,0,.18)}#lm[hidden]{display:none}

#fl{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:50%;transform:translateX(-50%);z-index:60;background:var(--rd);color:#fff;padding:10px 16px;border-radius:8px;max-width:90vw}#fl[hidden]{display:none}
#bell{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:58px;z-index:50;width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);display:grid;place-items:center;text-decoration:none}#bell[hidden]{display:none}
#bb{position:absolute;top:-5px;right:-5px;background:var(--rd);color:#fff;border-radius:10px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}#bb[hidden]{display:none}
#bell{cursor:pointer;font:inherit}#bell:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
.br{display:flex;gap:8px;align-items:flex-end}.br>div{flex:1}.br .btn{padding:10px 14px}
.kpi{font-size:clamp(20px,2.2vw,26px);overflow-wrap:anywhere}
.sqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.sq{position:relative;aspect-ratio:1;border:2px solid var(--sqc,var(--bd));border-radius:6px;overflow:hidden;background:var(--bg)}
.sq>i{position:absolute;left:0;right:0;bottom:0;opacity:.35}
.sqt{position:relative;display:flex;flex-direction:column;justify-content:space-between;height:100%;padding:8px}
.sqt b{font-size:12px;line-height:1.2;overflow:hidden;text-overflow:ellipsis}.sqp{font-size:22px;font-weight:700;line-height:1}.sqm{color:var(--mu);font-size:11px}.sqw{position:absolute;top:6px;right:6px;color:var(--rd);font-weight:700;font-size:11px}
.wf-wrap{display:flex;gap:18px;flex-wrap:wrap;align-items:center}.wf{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:min(100%,240px);aspect-ratio:1}.wf i{border-radius:2px}

#np{position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);left:min(58px,calc(100vw - 350px));z-index:50;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;width:min(340px,calc(100vw - 20px));max-height:min(60vh,420px);overflow:auto;box-shadow:0 6px 20px rgba(0,0,0,.18)}#np[hidden]{display:none}
.lh{font-size:13px;margin:0 10px 6px}.sw2{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:14px;margin:6px 10px;cursor:pointer}.sw2 input{width:auto;padding:0}
.lo.out{background:var(--rd);color:#fff;justify-content:center;margin-top:10px;font-weight:600}.lo.out:hover{background:var(--rd);filter:brightness(1.1)}
#lm{min-width:250px}

.biz-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:18px}
.biz-card{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--navy);border-radius:8px;padding:14px 16px}
.biz-lbl{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mu);font-weight:600}
.biz-val{font-size:21px;font-weight:700;margin:4px 0;color:var(--tx)}
.biz-sub{font-size:12px;color:var(--mu)}
.badge-opex{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600;background:rgba(79,127,232,.14);color:var(--bl)}
.badge-capex{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600;background:rgba(155,93,229,.14);color:#9b5de5}

async function syncAllBudgets(){
  if(!sb||!uid)return;
  const rows=cats.map(c=>({user_id:uid,category:c.n,amount:c.b}));
  const r=await sb.from('budgets').upsert(rows,{onConflict:'user_id,category'});
  if(r.error){
    await sb.from('budgets').delete().eq('user_id',uid);
    await sb.from('budgets').insert(rows);
  }
}
async function saveBudgetDb(category,amount){
  if(!sb||!uid)return;
  try{
    const exRow=await sb.from('budgets').select('id').eq('user_id',uid).eq('category',category).maybeSingle();
    if(exRow.data&&exRow.data.id){
      const u=await sb.from('budgets').update({amount}).eq('id',exRow.data.id);
      if(u.error)throw u.error;
    }else{
      const ins=await sb.from('budgets').insert({user_id:uid,category,amount});
      if(ins.error)throw ins.error;
    }
  }catch(e){
    console.error(e);
    flash('Không lưu được lên máy chủ. Kiểm tra mạng và thử lại.');
  }
}
async function delBudgetDb(category){
  if(!sb||!uid)return;
  try{

    console.error(e);

  }
}

function donutChart(customData, showBudget=false){
  const data = customData || cats.map(c => ({ n: c.n, v: spent(c.n), b: c.b, c: c.c }));
  const totalSpent = data.reduce((s, d) => s + d.v, 0);
  const R = 75;
  const C = 2 * Math.PI * R;
  let offset = 0;

  const segs = data.filter(a => a.v > 0).map(a => {
    const ratio = totalSpent ? a.v / totalSpent : 0;
    const length = ratio * C;
    const seg = `<circle cx="110" cy="110" r="${R}" fill="none" stroke="${a.c||cc(a.n)}" stroke-width="32" stroke-dasharray="${length} ${C - length}" stroke-dashoffset="${-offset}" transform="rotate(-90 110 110)"><title>${esc(a.n)}: ${fmt(a.v)} (${Math.round(ratio*100)}%)</title></circle>`;
    offset += length;
    return seg;
  }).join('');

  const legend = data.map(a => {
    const ratio = totalSpent ? a.v / totalSpent : 0;
    const budPct = (showBudget && a.b > 0) ? Math.round(a.v / a.b * 100) : (showBudget && a.v > 0 ? 101 : 0);
    const over = showBudget && a.b > 0 && a.v > a.b;
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px;gap:14px;">
      <span style="display:flex;align-items:center;gap:8px;min-width:115px;"><i class="swc" style="background:${a.c||cc(a.n)};width:13px;height:13px;border-radius:4px;display:inline-block;flex-shrink:0;"></i><span>${esc(a.n)}${over?' <b class="err">(Vượt!)</b>':''}</span></span>
      <div style="display:flex;align-items:center;justify-content:flex-end;gap:10px;flex:1;flex-wrap:wrap;">
        <span style="font-weight:600;text-align:right;">${fmt(a.v)}${showBudget&&a.b!==undefined?` <span class="mu" style="font-weight:400">/ ${fmt(a.b)}</span>`:''}</span>
        <span class="mu" style="min-width:38px;text-align:right;">${showBudget&&a.b!==undefined?budPct+'%':Math.round(ratio*100)+'%'}</span>
      </div>
    </div>`;
  }).join('');

  return `<div style="display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;padding:6px 0;">
    <svg viewBox="0 0 220 220" width="205" height="205" role="img" aria-label="Biểu đồ tròn chi tiêu theo danh mục" style="flex-shrink:0;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.12));">
      <circle cx="110" cy="110" r="${R}" fill="none" style="stroke:var(--bd)" stroke-width="32" opacity="0.4"/>
      ${segs}
      <text x="110" y="102" text-anchor="middle" font-size="13" fill="var(--mu)" font-weight="500">Tổng chi</text>
      <text x="110" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="var(--tx)">${fs(totalSpent)}</text>
    </svg>
    <div style="flex:1;min-width:260px;${data.length>5?'max-height:245px;overflow-y:auto;padding-right:6px;':''}">${legend}</div>
  </div>`;
}

report:()=>{
  const c=mAdd(0),p=mAdd(-1),t=total(),pt=monthTotal(p.key),df=pt?(t-pt)/pt*100:0,cnt=ex.filter(e=>inM(e,c.key)).length;
  const m12=Array.from({length:12},(_,i)=>mAdd(i-11));
  const m12Vals=m12.map(x=>monthTotal(x.key));
  const ytdTotal=m12Vals.reduce((s,v)=>s+v,0);
  const activeMonths=m12Vals.filter(v=>v>0).length||1;
  const burnRate=ytdTotal/activeMonths;
  const totalBud=bud();
  const varAmt=t-totalBud;
  const varPct=totalBud?(varAmt/totalBud*100):0;
  const fixedCost=spent('Tiền nhà');
  const varCost=Math.max(0,t-fixedCost);
  const fixedRatio=t?(fixedCost/t*100):0;
  const eduInvest=spent('Học tập');
  const capexRatio=t?(eduInvest/t*100):0;
  const dayOfMonth=Math.max(1,NOW.getDate());
  const dailyBurn=t/dayOfMonth;
  const remBud=Math.max(0,totalBud-t);
  const runwayDays=dailyBurn>0?Math.floor(remBud/dailyBurn):30;
  const sortedCats=[...cats].map(x=>({n:x.n,v:spent(x.n),b:x.b})).sort((a,b)=>b.v-a.v);
  const top3Sum=sortedCats.slice(0,3).reduce((s,x)=>s+x.v,0);
  const paretoPct=t?(top3Sum/t*100):0;
  const docCode='SW-FIN-'+c.y+String(c.m).padStart(2,'0');
  const todayStr=NOW.toLocaleDateString('vi-VN');

  return `
  <div class="print-only print-doc-head">
    <div style="display:flex;align-items:center;gap:12px;">
      <img src="${LOGO}" style="width:42px;height:42px;background:#1a2456;border-radius:8px;padding:0;object-fit:cover;" alt="Logo">
      <div>
        <div style="font-size:8.5pt;font-weight:700;color:#4f7fe8;letter-spacing:1px;text-transform:uppercase">STUDENT WALLET • PERSONAL FINANCIAL STATEMENT</div>
        <h1 style="font-size:15pt!important;margin:2px 0;">BÁO CÁO QUẢN TRỊ TÀI CHÍNH CÁ NHÂN (12 THÁNG)</h1>
        <div style="font-size:9pt;color:#555;">Kỳ báo cáo: Tháng ${c.m}/${c.y} (Lũy kế 12 tháng: T${m12[0].m}/${m12[0].y} – T${c.m}/${c.y})</div>
      </div>
    </div>
    <div class="print-meta">
      <div><b>Mã chứng từ:</b> ${docCode}</div>
      <div><b>Ngày lập:</b> ${todayStr}</div>
      <div><b>Đơn vị tính:</b> VNĐ</div>
    </div>
  </div>

  <div class="top no-print" style="align-items:center;">
    <div style="display:flex;align-items:center;gap:14px;">
      <img src="${LOGO}" style="width:44px;height:44px;background:var(--navy);border-radius:10px;padding:0;object-fit:cover;" alt="Logo">
      <div><h1>Báo cáo tài chính 12 tháng</h1><div class="sub" style="margin-bottom:0">Phân tích P&L cá nhân, Budget Variance & Burn Rate — Tháng ${c.m}/${c.y}</div></div>
    </div>
    <button class="btn" onclick="print()">🖨️ In báo cáo chuẩn A4 / Lưu PDF</button>
  </div>

  <div class="g4">
    <div class="card"><span class="mu">Chi tiêu kỳ này (T${c.m})</span><div class="kpi">${fmt(t)}</div><div class="biz-sub">MoM: <b style="color:var(--${df>0?'rd':'gr'})">${df>0?'+':''}${df.toFixed(1)}%</b> so với T${p.m}</div></div>
    <div class="card"><span class="mu">Lũy kế 12 tháng (LTM)</span><div class="kpi">${fmt(ytdTotal)}</div><div class="biz-sub">Bình quân: <b>${fmt(burnRate)}</b>/tháng</div></div>
    <div class="card"><span class="mu">Budget Variance (Chênh lệch NS)</span><div class="kpi" style="color:var(--${varAmt>0?'rd':'gr'})">${varAmt>0?'+':''}${fmt(varAmt)}</div><div class="biz-sub">${varAmt>0?'Unfavorable (Vượt NS)':'Favorable (Đạt NS)'} (${varPct>0?'+':''}${varPct.toFixed(1)}%)</div></div>
    <div class="card"><span class="mu">Cash Runway (Sức chịu đựng)</span><div class="kpi">${runwayDays} ngày</div><div class="biz-sub">Daily Burn: <b>${fmt(dailyBurn)}</b>/ngày</div></div>
  </div>

  <div class="card">
    <h2>Chỉ số phân tích tài chính (Business Analytics)</h2>
    <div class="biz-grid" style="margin-bottom:0">
      <div class="biz-card">
        <div class="biz-lbl">Fixed vs. Variable Cost</div>
        <div class="biz-val">${fixedRatio.toFixed(0)}% / ${(100-fixedRatio).toFixed(0)}%</div>
        <div class="biz-sub">Định phí: ${fmt(fixedCost)} • Biến phí: ${fmt(varCost)}</div>
      </div>
      <div class="biz-card" style="border-left-color:#9b5de5">
        <div class="biz-lbl">Human Capital CAPEX</div>
        <div class="biz-val">${capexRatio.toFixed(1)}%</div>
        <div class="biz-sub">Đầu tư Học tập: ${fmt(eduInvest)} / Tổng chi</div>
      </div>
      <div class="biz-card" style="border-left-color:#2bb3a3">
        <div class="biz-lbl">Pareto 80/20 (Top 3 Danh mục)</div>
        <div class="biz-val">${paretoPct.toFixed(1)}%</div>
        <div class="biz-sub">${sortedCats.slice(0,3).map(x=>x.n).join(', ')}</div>

      <div class="biz-card" style="border-left-color:#e0922b">
        <div class="biz-lbl">Transaction Velocity</div>
        <div class="biz-val">${cnt} giao dịch</div>
        <div class="biz-sub">Ticket Size TB: <b>${fmt(cnt?t/cnt:0)}</b>/lần</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Báo cáo Variance & Cấu trúc chi phí theo danh mục</h2>
    <div class="scroll" style="${cats.length>5?'max-height:290px;overflow-y:auto;':''}">
      <table>
        <tr>
          <th style="position:sticky;top:0;z-index:2">Danh mục</th>
          <th style="position:sticky;top:0;z-index:2">Phân loại</th>
          <th class="r" style="position:sticky;top:0;z-index:2">Thực chi T${p.m}</th>
          <th class="r" style="position:sticky;top:0;z-index:2">Thực chi T${c.m}</th>
          <th class="r" style="position:sticky;top:0;z-index:2">Ngân sách (Budget)</th>
          <th class="r" style="position:sticky;top:0;z-index:2">Variance</th>
          <th class="r" style="position:sticky;top:0;z-index:2">Tỷ trọng</th>
        </tr>
        ${cats.map(x=>{
          const a=spentIn(x.n,p.key),b=spent(x.n),v=b-x.b,share=t?(b/t*100):0;
          const isCapex=x.n==='Học tập',isFixed=x.n==='Tiền nhà';
          const badge=isCapex?'<span class="badge-capex">CAPEX</span>':(isFixed?'<span class="badge-opex">Fixed OPEX</span>':'<span class="badge-opex">Var OPEX</span>');
          return `<tr>
            <td>${tag(x.n)}</td>
            <td>${badge}</td>
            <td class="r">${fmt(a)}</td>
            <td class="r"><b>${fmt(b)}</b></td>
            <td class="r">${fmt(x.b)}</td>
            <td class="r" style="color:var(--${v>0?'rd':'gr'})">${v>0?'+':''}${fmt(v)}</td>
            <td class="r">${share.toFixed(1)}%</td>
          </tr>`;
        }).join('')}
      </table>
    </div>
  </div>

  <div class="card">
    <div class="row" style="align-items:center;margin-bottom:8px">
      <h2 style="margin:0">Xu hướng dòng tiền chi ra 12 tháng (LTM Cash Outflow)</h2>
      <span class="mu" style="font-size:13px">T${m12[0].m}/${m12[0].y} – T${c.m}/${c.y}</span>
    </div>
    ${trend()}
  </div>

  <div class="print-only print-sign">
    <div>
      <b>NGƯỜI LẬP BÁO CÁO</b><br><span style="font-size:8.5pt;color:#666">(Ký và ghi rõ họ tên)</span>
      <div class="box"></div>
      <div>Sinh viên thực hiện</div>
    </div>
    <div>
      <b>XÁC NHẬN / GHI CHÚ QUẢN TRỊ</b><br><span style="font-size:8.5pt;color:#666">Generated by Student Wallet Analytics</span>
      <div class="box"></div>
      <div>Ngày ${todayStr}</div>
    </div>
  </div>`;
},

const NAV=[['dashboard','Tổng quan'],['scan','Quét hóa đơn'],['expenses','Thêm khoản chi'],['history','Lịch sử chi tiêu'],['budget','Ngân sách'],['report','Báo cáo'],['groups','Nhóm & Chia sẻ'],];

function toast(t){const m=$('#m');if(m){m.className='ok';m.textContent=t}}
function err(t){const m=$('#m');if(m){m.className='err';m.textContent=t}}
function addEx(){if(commit())location.hash='#history'}
function guess(name,def='Ăn uống'){const s=name.toLowerCase(),X={'Mua sắm':'quần áo áo quần giày nồi chảo chén dĩa túi','Ăn uống':'rau thịt cá trứng gạo nước sữa bánh trái cây'};
 for(const c of cats)if(c.k.split(/\s+/).concat((X[c.n]||'').split(' ')).some(k=>k&&s.includes(k)))return c.n;return cats.some(c=>c.n===def)?def:(cats[0]||{n:def}).n}
const itRows=()=>ed.items.map((p,i)=>`<div class="ir"><input placeholder="Tên món (VD: Rau)" aria-label="Tên món" value="${esc(p.n)}" onchange="ed.items[${i}].n=this.value;ed.items[${i}].c=guess(this.value,ed.items[${i}].c);drawIt()"><input class="money" inputmode="numeric" aria-label="Số tiền" placeholder="Số tiền" value="${p.a?fmtN(p.a):''}" oninput="ed.items[${i}].a=num(this.value);sync()"><select aria-label="Danh mục" onchange="ed.items[${i}].c=this.value">${catOpts(p.c)}</select><button class="btn o" onclick="rmIt(${i})" aria-label="Xóa món">✕</button></div>`).join('');
const edHTML=()=>`<label>Chi tiết từng món (tùy chọn)</label><div id="it" style="max-height:270px;overflow-y:auto;padding-right:6px;margin-bottom:8px">${itRows()}</div><button class="btn o" onclick="addIt()">+ Chi tiết</button>`;
function drawIt(){
  const it=$('#it');if(it)it.innerHTML=itRows();
  const cnt=$('#itCnt');if(cnt)cnt.textContent=ed.items.length;
  const sp=$('#persSplit');if(sp)sp.classList.toggle('has-items',ed.items.length>0);
  const cd=$('#expCard');if(cd)cd.style.maxWidth=ed.items.length?'1080px':'560px';
  sync();
}
function addIt(){ed.items.push({n:'',a:0,c:($('#c')||{}).value||'Ăn uống'});drawIt()}

function delEx(i){

const SAMP={'WinMart':[['Rau củ',85000,'Ăn uống'],['Thịt heo',120000,'Ăn uống'],['Nồi chảo',280000,'Mua sắm']],'Uniqlo':[['Áo thun',390000,'Mua sắm'],['Quần jeans',590000,'Mua sắm']],'Highlands Coffee':[['Cà phê',65000,'Ăn uống'],['Bánh ngọt',55000,'Ăn uống']],'Grab':[['Chuyến xe',48000,'Di chuyển']],'CGV Vincom':[['Vé xem phim',190000,'Giải trí'],['Bắp nước',85000,'Giải trí']]};
const norm=s=>(s||'').toLowerCase().replace(/\s+/g,' ').trim();
const NUMR=/\d{1,3}(?:[.,]\d{3})+|\d{4,}/g,KEYR=/tổng|thành tiền|thanh toán|cộng|total|amount due|tiền mặt|khách đưa|trả lại|vat|thuế/i,TOTR=/tổng|thành tiền|thanh toán|total|amount due|cộng/i,toN=x=>+x.replace(/[.,]/g,'');
function parseReceipt(text){
 const L=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 const shop=(L.find(l=>/[A-Za-zÀ-ỹ]{3,}/.test(l)&&!/hóa đơn|phiếu|receipt|invoice|^\d/i.test(l))||'').replace(/[^A-Za-zÀ-ỹ0-9 .&'-]/g,'').trim().slice(0,60);
 let date=today(),dateFound=false;const dm=text.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
 if(dm){const d=+dm[1],m=+dm[2],y=dm[3].length==2?2000+ +dm[3]:+dm[3];if(m>=1&&m<=12&&d>=1&&d<=31&&y>=2000&&y<=2100){const cand=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');if(validDate(cand)){date=cand;dateFound=true}}}
 const nums=l=>(l.match(NUMR)||[]).map(toN).filter(n=>n>=1000&&n<=1e9);
 const tl=L.filter(l=>TOTR.test(l)).flatMap(nums);let total=tl.length?Math.max(...tl):0;
 if(!total){const all=L.flatMap(nums);total=all.length?Math.max(...all):0}
 const cat=guess(shop,'Khác'),items=[];
 for(const l of L){if(KEYR.test(l)||(dm&&l.includes(dm[0])))continue;
  const m=l.match(/^(.*?[A-Za-zÀ-ỹ].*?)[\s:.]+(?:\d+\s*[x×]\s*)?(\d{1,3}(?:[.,]\d{3})+|\d{4,})\s*(?:đ|d|vnd|₫)?$/i);if(!m)continue;
  const a=toN(m[2]),n=m[1].replace(/^[\d\s.\-*]+/,'').trim();if(a>=1000&&(!total||a<=total)&&n.length>=2&&n!==shop)items.push({n:n.slice(0,60),a,c:guess(n,cat)})}
 const sum=items.reduce((x,p)=>x+p.a,0);if(items.length&&total>sum)items.push({n:'Phí, thuế và khác',a:total-sum,c:guess('','Khác')});
 return{shop,cat,date,dateFound,total,items,empty:!text.trim()}}

async function prep(file,maxDim=1600){
  const b=await createImageBitmap(file),k=Math.min(1,maxDim/Math.max(b.width,b.height)),c=document.createElement('canvas');
  c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(b,0,0,c.width,c.height);
  return c;
}

async function scanWithGemini(canvas){
  if(!sb)return null;
  try{
    const base64=canvas.toDataURL('image/jpeg',0.85).split(',')[1];
    const catList=cats.map(c=>c.n);
    const payload={imageBase64:base64,mimeType:'image/jpeg',categories:catList,today:today()};
    let res=await sb.functions.invoke('scan-reiceipt',{body:payload});
    if(res.error)res=await sb.functions.invoke('scan-receipt',{body:payload});
    const{data,error}=res;
    if(error||!data||data.error){console.warn('Edge Function error:',error||data);return null;}
    const validCat=c=>catList.includes(c)?c:guess(c,'Khác');
    const items=(Array.isArray(data.items)?data.items:[])
      .map(it=>({n:String(it.n||'').trim().slice(0,60),a:num(it.a),c:validCat(it.c)}))
      .filter(it=>it.n&&it.a>0);
    const total=num(data.total,MAXV_GRP)||items.reduce((s,p)=>s+p.a,0);
    const shop=String(data.shop||'').trim().slice(0,60);
    const d=String(data.date||'').trim();
    const date=validDate(d)?d:today();
    const cat=validCat(data.cat||guess(shop,'Khác'));
    if(!shop&&!total&&!items.length)return null;
    return{shop,cat,date,dateFound:validDate(d),total,items,ai:true};
  }catch(e){
    console.warn('AI Vision fallback to OCR:',e);
    return null;
  }
}

async function doScan(file){if(!file)return;
 const r=new FileReader();r.onload=()=>{$('#pv').innerHTML=`<img src="${r.result}" alt="Hóa đơn đã tải">`};r.readAsDataURL(file);
 const pg=$('#pg');$('#fm').innerHTML='<span class="mu">Đang phân tích hóa đơn…</span>';
 try{
  const canvas=await prep(file,1600);
  pg.innerHTML='<div class="mu">Đang quét thông minh bằng AI Vision…</div><div class="bar"><i style="width:45%"></i></div>';
  const aiRes=await scanWithGemini(canvas);

    pg.innerHTML='<div class="ok">✓ AI đã đọc xong hóa đơn! Kiểm tra lại thông tin bên phải.</div>';
    ed.items=aiRes.items;

 try{pg.innerHTML='<div class="mu">Đang đọc chữ bằng OCR dự phòng (lần đầu có thể mất vài phút)…</div><div class="bar"><i style="width:15%"></i></div>';
  w=await Tesseract.createWorker('vie+eng',1,{logger:m=>{if(m.status==='recognizing text'){const p=Math.round(m.progress*100);pg.innerHTML=`<div class="mu">Đang nhận dạng chữ… ${p}%</div><div class="bar"><i style="width:${p}%"></i></div>`}}});
  const{data}=await w.recognize(await prep(file,2000));const o=parseReceipt(data.text||'');
  pg.innerHTML=o.empty?'<div class="err">Không đọc được hóa đơn. Thử ảnh khác hoặc nhập tay.</div>':'<div class="ok">Đã quét xong. Kiểm tra lại thông tin bên phải.</div>';
  ed.items=o.items;draft={s:o.shop,c:o.cat,d:o.date,a:o.total,ocr:{s:o.shop,a:o.total,d:o.dateFound?o.date:''}};form()
 }catch(x){console.error(x);pg.innerHTML='<div class="err">Không đọc được hóa đơn. Thử ảnh khác hoặc nhập tay.</div>';ed.items=[];draft={s:'',c:guess('','Khác'),d:today(),a:0,ocr:null};form()}
 finally{if(w)w.terminate()}}

const gStoreKey=(k)=>'sw_grp_'+k;
function getLocalGrpMeta(){try{return JSON.parse(localStorage.getItem(gStoreKey('meta'))||'{}')}catch(e){return{}}}
function saveLocalGrpMeta(m){try{localStorage.setItem(gStoreKey('meta'),JSON.stringify(m))}catch(e){}}
function getGrpOpts(gid){const m=getLocalGrpMeta();return Object.assign({budget:true,over:true,weekly:true},(m[gid]&&m[gid].opts)||{})}
function setGrpOpt(gid,k,v){const m=getLocalGrpMeta();m[gid]=m[gid]||{perms:{}};m[gid].opts=Object.assign(getGrpOpts(gid),{[k]:!!v});saveLocalGrpMeta(m);flash('Đã lưu tùy chọn thông báo nhóm.')}
async function leaveGroup(gid){
  const grp=myGroups.find(g=>g.id===gid);
  if(!grp)return;
  const isLeader=grp.owner_id===uid;
  const msg=isLeader
    ? 'Bạn đang là trưởng nhóm. Nếu rời nhóm mà không còn trưởng nhóm khác, nhóm có thể bị giải tán hoặc chuyển quyền. Bạn có chắc muốn rời nhóm "' + grp.name + '"?'
    : 'Bạn có chắc chắn muốn rời khỏi nhóm "' + grp.name + '"?';
  ask(msg, async ()=>{
    if(sb){
      await safeDb(()=>sb.from('group_members').delete().eq('group_id',gid).eq('user_id',uid));
      if(isLeader && (grp.members||[]).length<=1){
        await safeDb(()=>sb.from('group_expenses').delete().eq('group_id',gid));
        await safeDb(()=>sb.from('groups').delete().eq('id',gid));
      }

    if(activeGroupId===gid){activeGroupId=null;grpEx=[];}
    flash('Bạn đã rời khỏi nhóm.');
    render();

}
function getLocalGrpEx(gid){try{return JSON.parse(localStorage.getItem(gStoreKey('ex_'+gid))||'[]')}catch(e){return[]}}
function saveLocalGrpEx(gid,list){try{localStorage.setItem(gStoreKey('ex_'+gid),JSON.stringify(list))}catch(e){}}
function getLocalGrpBud(gid){try{const raw=JSON.parse(localStorage.getItem(gStoreKey('bud_'+gid))||'null');if(Array.isArray(raw))return{list:raw,thr:80};return raw}catch(e){return null}}
function saveLocalGrpBud(gid,list,t){
  const th=t!==undefined?t:grpThr;
  try{localStorage.setItem(gStoreKey('bud_'+gid),JSON.stringify({list,thr:th}))}catch(e){}
  if(sb&&gid){
    safeDb(async ()=>{
      await sb.from('group_budgets').delete().eq('group_id',gid);
      if(list&&list.length){
        await sb.from('group_budgets').insert(list.map(c=>({group_id:gid,category:c.n,amount:c.b,color:c.c||'',threshold:th})));
      }
    });
  }
}
function grpAlertCheck(grpName, catName){
  const activeBuds = grpBuds.length ? grpBuds : cats.map(c=>({n:c.n,b:c.b,c:c.c}));
  const bObj = activeBuds.find(x=>x.n===catName);
  if(!bObj) return;
  const curMKey = mAdd(0).key;
  const sp = grpEx.filter(e=>inM(e,curMKey)&&e.c===catName).reduce((s,e)=>s+e.a,0);
  const p = bObj.b>0 ? (sp/bObj.b*100) : (sp>0?101:0);
  const gOpts = getGrpOpts(activeGroupId);
  if(p>100 && gOpts.over) push(bObj.b>0?`[Nhóm ${grpName}] ${catName} đã vượt ngân sách (${fmtPct(p)})`:`[Nhóm ${grpName}] ${catName} đã vượt ngân sách (ngân sách 0 đ)`,'--rd');
  else if(p>=grpThr && p<=100 && gOpts.budget) push(`[Nhóm ${grpName}] ${catName} đã dùng ${fmtPct(p)} ngân sách`,'--am');
}

async function ensureUserProfile(){
  if(!sb||!uid)return;
  try{
    let authName=cleanName(userName);
    let {data:up}=await sb.from('user_profiles').select('*').eq('id',uid).maybeSingle();
    const dbName=up?cleanName(up.full_name):'';
    const bestName=dbName||authName;
    if(!up){
      const newCode=genCode('US');
      const ins=await sb.from('user_profiles').insert({id:uid,user_code:newCode,full_name:bestName}).select().single();
      if(ins.data)up=ins.data;
    }else if(bestName && up.full_name!==bestName){
      await sb.from('user_profiles').update({full_name:bestName}).eq('id',uid);
      up.full_name=bestName;
    }
    if(up){
      userCode=up.user_code;
      if(cleanName(up.full_name))userName=cleanName(up.full_name);
    }
    if(!cleanName(userName) && authName)userName=authName;
  }catch(e){console.warn('user_profiles:',e)}
}

async function loadGroups(){
  if(!sb||!uid)return;
  try{
    const {data:gms}=await sb.from('group_members').select('*').eq('user_id',uid);
    const gids=[...new Set((gms||[]).map(x=>x.group_id))];
    if(!gids.length){myGroups=[];return;}
    const [{data:grps},{data:allMems},{data:allProfs}]=await Promise.all([
      sb.from('groups').select('*').in('id',gids),
      sb.from('group_members').select('*').in('group_id',gids),
      sb.from('user_profiles').select('*')
    ]);
    const profMap=Object.fromEntries((allProfs||[]).map(p=>[p.id,p]));
    const meta=getLocalGrpMeta();
    myGroups=(grps||[]).map(g=>{
      const gMeta=meta[g.id]||{};
      const members=(allMems||[]).filter(m=>m.group_id===g.id).map(m=>{
        const isOwner = m.user_id === g.owner_id;
        const dbCanEdit = (typeof m.can_edit === 'boolean') ? m.can_edit : (m.role === 'editor');
        const localPerm = gMeta.perms && typeof gMeta.perms[m.user_id] === 'boolean' ? gMeta.perms[m.user_id] : false;
        return {
          user_id: m.user_id,
          full_name: (profMap[m.user_id]||{}).full_name || 'Thành viên',
          user_code: (profMap[m.user_id]||{}).user_code || '',
          can_edit: isOwner ? true : (dbCanEdit || localPerm)
        };
      });
      const ownerProf = profMap[g.owner_id] || members.find(m=>m.user_id===g.owner_id) || {};
      return {...g, owner_name: ownerProf.full_name || 'Trưởng nhóm', members};
    });
  }catch(e){console.warn('loadGroups:',e)}
}

  if(btn){btn.disabled=true;btn.textContent='Đang tạo...';}
  try{
    const gcode=genCode('GRP');
    const {data:g,error}=await sb.from('groups').insert({name:nm,group_code:gcode,owner_id:uid}).select().single();
    if(error){if(m)m.textContent='Lỗi tạo nhóm: '+error.message;return;}

    busyLock.createGroup=false;

  }
}

async function addMemberByUserCode(gid){
  if(busyLock.addMem)return;
  const inp=$('#addm_'+gid),m=$('#mm_'+gid),btn=$('#btnAddMem_'+gid);
  const raw=(inp?.value||'').trim().toUpperCase();
  if(!raw){if(m)m.textContent='Nhập mã riêng của người dùng.';return;}
  if(!sb){if(m)m.textContent='Chưa kết nối máy chủ.';return;}
  busyLock.addMem=true;
  if(btn){btn.disabled=true;btn.textContent='Đang thêm...';}
  try{
    const {data:prof}=await sb.from('user_profiles').select('*').eq('user_code',raw).maybeSingle();
    if(!prof){if(m)m.textContent='Không tìm thấy người dùng có mã '+raw;return;}

  const meta=getLocalGrpMeta();

    await safeDb(()=>sb.from('group_members').update({can_edit:!!canEdit}).eq('group_id',gid).eq('user_id',targetUid));

async function loadGroupData(gid){
  if(!gid)return;
  const grp=myGroups.find(g=>g.id===gid);
  if(!grp)return;
  let loadedFromDb=false;
  if(sb){
    try{
      const {data:gRows, error}=await sb.from('group_expenses').select('*').eq('group_id',gid).order('spent_on',{ascending:false});
      if(!error && Array.isArray(gRows)){
        loadedFromDb=true;
        const localPrev = Object.fromEntries(getLocalGrpEx(gid).map(x=>[x.id, x]));
        grpEx=gRows.map(r=>{
          const mem=(grp.members||[]).find(m=>m.user_id===r.user_id);
          const lp = localPrev[r.id] || {};
          const itemObj = {
            id:r.id,
            group_id:r.group_id,
            uid:r.user_id,
            memberName:r.member_name || (mem?mem.full_name:'Thành viên'),
            d:r.spent_on,
            s:r.shop,
            c:r.category,
            a:+r.amount,
            edits: typeof r.edit_count==='number' ? r.edit_count : (lp.edits || 0),
            paid: typeof r.is_paid==='boolean' ? r.is_paid : (typeof lp.paid==='boolean' ? lp.paid : true)
          };
          if(Array.isArray(r.items) && r.items.length) itemObj.items = r.items;
          else if(lp.items && lp.items.length) itemObj.items = lp.items;
          return itemObj;
        });
        saveLocalGrpEx(gid, grpEx);
      }
    }catch(e){}
  }
  if(!loadedFromDb){
    grpEx=getLocalGrpEx(gid).map(x=>({edits:0, paid:true, ...x}));
  }
  let dbBuds=null, dbThr=null;
  if(sb){
    try{
      const {data:gbRows, error:gbErr}=await sb.from('group_budgets').select('*').eq('group_id',gid);
      if(!gbErr && Array.isArray(gbRows) && gbRows.length){
        dbBuds=gbRows.map(r=>({n:r.category, b:+r.amount, c:r.color||META[r.category]?.c||PAL[hash(r.category)%PAL.length]}));
        dbThr=gbRows[0].threshold || 80;
      }
    }catch(e){}
  }
  const savedBud=getLocalGrpBud(gid);
  grpBuds = dbBuds || ((savedBud && savedBud.list) ? savedBud.list : cats.map(c=>({n:c.n, b:c.b, c:c.c})));
  grpThr = dbThr || ((savedBud && savedBud.thr) ? savedBud.thr : 80);
}

async function addGrpExpense(){
  if(busyLock.addGrpExp)return;
  const grp=myGroups.find(g=>g.id===activeGroupId);
  if(!grp)return;
  const me=(grp.members||[]).find(m=>m.user_id===uid);
  const canEdit = grp.owner_id===uid || (me && me.can_edit);
  if(!canEdit)return flash('Bạn chỉ có quyền xem trong nhóm này.');

  const s=($('#gs')||{}).value?.trim(),d=($('#gd')||{}).value,m=$('#gm_add'),btn=$('#btnSaveGrpExp');
  const buyerUid = ($('#gmem')||{}).value || uid;
  const buyerObj = (grp.members||[]).find(x=>x.user_id===buyerUid);
  const buyerName = buyerObj ? buyerObj.full_name : userName;
  const isPaid = ($('#gpaid')||{}).value === '1';

  let a=num(($('#ga')||{}).value,MAXV_GRP),c=($('#gc')||{}).value,its=null;
  if(!d){if(m)m.textContent='Chọn ngày chi tiêu.';return;}
  if(!s){if(m)m.textContent='Nhập tên cửa hàng hoặc nội dung.';return;}
  if(grpEdItems.length){
    if(grpEdItems.some(p=>!p.n.trim()||!(p.a>0))){if(m)m.textContent='Mỗi món cần có tên và số tiền lớn hơn 0.';return;}
    its=grpEdItems.map(p=>{
      const pUid = p.uid || buyerUid;
      const pMem = (grp.members||[]).find(x=>x.user_id===pUid);
      return {...p, n:p.n.trim(), uid:pUid, memberName: pMem ? pMem.full_name : buyerName};
    });
    a=its.reduce((x,p)=>x+p.a,0);
    const mp={};its.forEach(p=>mp[p.c]=(mp[p.c]||0)+p.a);
    c=Object.keys(mp).sort((x,y)=>mp[y]-mp[x])[0];
  }
  if(!(a>0)){if(m)m.textContent='Nhập số tiền lớn hơn 0.';return;}

  busyLock.addGrpExp=true;
  if(btn){btn.disabled=true;btn.textContent='Đang lưu...';}
  try{
    const newItem={
      id:'gex_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
      group_id:activeGroupId,
      uid:buyerUid,
      memberName:buyerName,
      d:d,
      s:s,
      c:c,
      a:a,
      edits:0,
      paid:isPaid,
      ts:Date.now()
    };
    if(its)newItem.items=its;

    if(sb){
      try{
        const basePayload={
          group_id:activeGroupId,
          user_id:buyerUid,
          member_name:buyerName,
          spent_on:d,
          shop:s,
          category:c,
          amount:a
        };
        let {data:ins, error}=await sb.from('group_expenses').insert({...basePayload, is_paid:isPaid, edit_count:0, items:its||[]}).select().single();
        if(error){
          const fallback=await sb.from('group_expenses').insert(basePayload).select().single();
          ins=fallback.data; error=fallback.error;
        }
        if(!error && ins) newItem.id=ins.id;
      }catch(e){}
    }
    grpEx.unshift(newItem);
    saveLocalGrpEx(activeGroupId, grpEx);
    if(inM(newItem,mAdd(0).key)) grpAlertCheck(grp.name, c);

async function doGrpScan(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{const pv=$('#gpv');if(pv)pv.innerHTML=`<img src="${r.result}" alt="Hóa đơn nhóm">`};
  r.readAsDataURL(file);
  const pg=$('#gpg'), fm=$('#gfm');
  if(fm)fm.innerHTML='<span class="mu">Đang phân tích hóa đơn nhóm…</span>';
  try{
    const canvas=await prep(file,1600);
    if(pg)pg.innerHTML='<div class="mu">Đang quét thông minh bằng AI Vision…</div><div class="bar"><i style="width:45%"></i></div>';
    const aiRes=await scanWithGemini(canvas);
    if(aiRes){
      if(pg)pg.innerHTML='<div class="ok">✓ AI đã đọc xong hóa đơn! Kiểm tra lại từng món bên phải.</div>';
      grpEdItems = aiRes.items || [];
      grpDraft={s:aiRes.shop,c:aiRes.cat,d:aiRes.date,a:aiRes.total,items:grpEdItems};
      grpScanForm();
      return;
    }
  }catch(e){console.warn(e)}
  if(!window.Tesseract){if(pg)pg.innerHTML='<div class="err">Không tải được bộ nhận dạng chữ.</div>';return}
  let w;
  try{
    if(pg)pg.innerHTML='<div class="mu">Đang đọc chữ bằng OCR…</div><div class="bar"><i style="width:30%"></i></div>';
    w=await Tesseract.createWorker('vie+eng',1);
    const{data}=await w.recognize(await prep(file,2000));
    const o=parseReceipt(data.text||'');
    if(pg)pg.innerHTML=o.empty?'<div class="err">Không đọc được hóa đơn. Thử ảnh khác hoặc nhập tay.</div>':'<div class="ok">Đã quét xong. Kiểm tra lại bên phải.</div>';
    grpEdItems = o.items || [];
    grpDraft={s:o.shop,c:o.cat,d:o.date,a:o.total,items:grpEdItems};
    grpScanForm();
  }catch(x){
    if(pg)pg.innerHTML='<div class="err">Không đọc được hóa đơn.</div>';
    grpEdItems = [];
    grpDraft={s:'',c:'Khác',d:today(),a:0,items:[]};
    grpScanForm();
  }finally{if(w)w.terminate()}
}

async function saveGrpScan(){
  if(busyLock.saveGrpScan)return;
  const grp=myGroups.find(g=>g.id===activeGroupId);
  if(!grp)return;
  const s=($('#g_ss')||{}).value?.trim(), c0=($('#g_sc')||{}).value, d=($('#g_sd')||{}).value, m=$('#g_sm'), btn=$('#btnSaveGrpScan');
  const buyerUid = ($('#g_smem')||{}).value || uid;
  const buyerObj = (grp.members||[]).find(x=>x.user_id===buyerUid);
  const buyerName = buyerObj ? buyerObj.full_name : userName;
  const isPaid = ($('#g_sgpaid')||{}).value === '1';

  let a=num(($('#g_sa')||{}).value,MAXV_GRP), c=c0, its=null;
  if(!d){if(m)m.textContent='Chọn ngày chi tiêu.';return;}
  if(!s){if(m)m.textContent='Nhập tên cửa hàng hoặc nội dung.';return;}
  if(grpEdItems.length){
    if(grpEdItems.some(p=>!p.n.trim()||!(p.a>0))){if(m)m.textContent='Mỗi món cần có tên và số tiền lớn hơn 0.';return;}
    its=grpEdItems.map(p=>{
      const pUid = p.uid || buyerUid;
      const pMem = (grp.members||[]).find(x=>x.user_id===pUid);
      return {...p, n:p.n.trim(), uid:pUid, memberName: pMem ? pMem.full_name : buyerName};
    });
    a=its.reduce((x,p)=>x+p.a,0);
    const mp={};its.forEach(p=>mp[p.c]=(mp[p.c]||0)+p.a);
    c=Object.keys(mp).sort((x,y)=>mp[y]-mp[x])[0];
  }
  if(!(a>0)){if(m)m.textContent='Nhập số tiền lớn hơn 0.';return;}

  busyLock.saveGrpScan=true;
  if(btn){btn.disabled=true;btn.textContent='Đang lưu...';}
  try{
    const newItem={
      id:'gex_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
      group_id:activeGroupId,
      uid:buyerUid,
      memberName:buyerName,
      d, s, c, a,
      edits:0,
      paid:isPaid,
      ts:Date.now()
    };
    if(its)newItem.items=its;
    if(sb){
      try{
        const basePayload={
          group_id:activeGroupId, user_id:buyerUid, member_name:buyerName, spent_on:d, shop:s, category:c, amount:a
        };
        let {data:ins, error}=await sb.from('group_expenses').insert({...basePayload, is_paid:isPaid, edit_count:0, items:its||[]}).select().single();
        if(error){
          const fallback=await sb.from('group_expenses').insert(basePayload).select().single();
          ins=fallback.data; error=fallback.error;
        }
        if(!error && ins) newItem.id=ins.id;
      }catch(e){}
    }
    grpEx.unshift(newItem);
    saveLocalGrpEx(activeGroupId, grpEx);
    if(inM(newItem,mAdd(0).key)) grpAlertCheck(grp.name, c);
    grpDraft=null;
    grpEdItems=[];
    grpOp.add(newItem.id);
    flash('Đã lưu hóa đơn quét vào chi tiêu nhóm!');
    grpTab='history';
    render();
  }finally{
    busyLock.saveGrpScan=false;
    if(btn){btn.disabled=false;btn.textContent='💾 Lưu vào chi tiêu nhóm';}
  }
}

function tgGrpEx(eid){

async function saveGrpEdit(eid){
  const grp=myGroups.find(g=>g.id===activeGroupId);
  const e=grpEx.find(x=>x.id===eid);
  if(!e)return;
  const s=($('#ges_'+eid)||{}).value?.trim(), d=($('#ged_'+eid)||{}).value, a=num(($('#gea_'+eid)||{}).value,MAXV_GRP), c=($('#gec_'+eid)||{}).value, m=$('#gem_'+eid);
  const newUid = ($('#gemem_'+eid)||{}).value || e.uid;
  const memObj = grp && (grp.members||[]).find(x=>x.user_id===newUid);
  const newMemName = memObj ? memObj.full_name : e.memberName;
  const sum=(e.items||[]).reduce((x,p)=>x+p.a,0);
  if(!s){if(m)m.textContent='Nhập tên cửa hàng hoặc nội dung.';return;}
  if(!d){if(m)m.textContent='Chọn ngày chi tiêu.';return;}
  if(!(a>0)){if(m)m.textContent='Nhập số tiền lớn hơn 0.';return;}
  if(a<sum){if(m)m.textContent='Số tiền không được nhỏ hơn tổng các món đã chi tiết ('+fmt(sum)+').';return;}
  if((e.edits||0)>=3){if(m)m.textContent='Hóa đơn này đã hết lượt sửa (3/3).';return;}
  if(s===e.s && d===e.d && a===e.a && c===e.c && newUid===e.uid){
    grpEditId=null;
    return updGrpHist();
  }
  e.s=s; e.d=d; e.a=a; e.c=c; e.uid=newUid; e.memberName=newMemName;
  e.edits=(e.edits||0)+1;
  saveLocalGrpEx(activeGroupId, grpEx);
  grpEditId=null;
  flash('Đã lưu thay đổi hóa đơn nhóm ('+e.edits+'/3 lần sửa).');
  render();
  await safeDb(async ()=>{
    const {error}=await sb.from('group_expenses').update({shop:s,spent_on:d,amount:a,category:c,user_id:newUid,member_name:newMemName,edit_count:e.edits,items:e.items||[]}).eq('id',eid);
    if(error) await sb.from('group_expenses').update({shop:s,spent_on:d,amount:a,category:c,user_id:newUid,member_name:newMemName}).eq('id',eid);
  });
}

function addGrpDet(eid){
  const grp=myGroups.find(g=>g.id===activeGroupId);
  const e=grpEx.find(x=>x.id===eid);
  if(!e)return;
  const rem=e.a-(e.items||[]).reduce((s,p)=>s+p.a,0);
  const n=($('#gdn_'+eid)||{}).value?.trim(), a=num(($('#gda_'+eid)||{}).value,MAXV_GRP);
  let c=($('#gdc_'+eid)||{}).value;
  const pUid=($('#gdmem_'+eid)||{}).value || e.uid;
  const memObj = grp && (grp.members||[]).find(x=>x.user_id===pUid);
  const pMemName = memObj ? memObj.full_name : e.memberName;
  const m=$('#gdm_'+eid);
  if(!n){if(m)m.textContent='Nhập tên món.';return;}
  if(!(a>0)){if(m)m.textContent='Nhập số tiền lớn hơn 0.';return;}
  if(a>rem){if(m)m.textContent=`Số tiền vượt phần còn lại của hóa đơn (${fmt(rem)}).`;return;}
  if(c===e.c)c=guess(n,c);
  e.items=e.items||[];
  e.items.push({n,c,a,uid:pUid,memberName:pMemName});
  saveLocalGrpEx(activeGroupId, grpEx);
  safeDb(()=>sb.from('group_expenses').update({items:e.items||[]}).eq('id',eid));
  render();
}

function updGrpDet(eid, idx, field, val){
  const grp=myGroups.find(g=>g.id===activeGroupId);
  const e=grpEx.find(x=>x.id===eid);
  if(!e||!e.items||!e.items[idx])return;
  if(field==='a'){
    const nv=num(val,MAXV_GRP);
    const otherSum=e.items.reduce((s,p,i)=>i===idx?s:s+p.a,0);
    if(!(nv>0) || otherSum+nv > e.a){
      flash('Số tiền món không hợp lệ hoặc vượt quá tổng hóa đơn.');
      return render();
    }
    e.items[idx].a=nv;
  }else if(field==='n'){
    if(!val.trim())return render();
    e.items[idx].n=val.trim();
  }else if(field==='c'){
    e.items[idx].c=val;
  }else if(field==='uid'){
    const memObj = grp && (grp.members||[]).find(x=>x.user_id===val);
    e.items[idx].uid=val;
    e.items[idx].memberName = memObj ? memObj.full_name : e.memberName;
  }
  saveLocalGrpEx(activeGroupId, grpEx);
  safeDb(()=>sb.from('group_expenses').update({items:e.items||[]}).eq('id',eid));
  render();
}

function delGrpDet(eid, idx){
  const e=grpEx.find(x=>x.id===eid);
  if(!e||!e.items)return;
  e.items.splice(idx,1);
  saveLocalGrpEx(activeGroupId, grpEx);
  safeDb(()=>sb.from('group_expenses').update({items:e.items||[]}).eq('id',eid));
  render();
}

async function deleteGroup(gid){
  ask('Xóa nhóm này? Toàn bộ dữ liệu riêng của nhóm sẽ bị xóa, dữ liệu cá nhân của bạn không bị ảnh hưởng.', async ()=>{
    if(sb){
      await safeDb(()=>sb.from('group_expenses').delete().eq('group_id', gid));
      const rmMem = await sb.from('group_members').delete().eq('group_id', gid);
      const rmGrp = await sb.from('groups').delete().eq('id', gid);
      if(rmMem.error && rmGrp.error){
        const rmSelf = await sb.from('group_members').delete().eq('group_id', gid).eq('user_id', uid);
        if(rmSelf.error) return flash('Không thể xóa nhóm: ' + rmSelf.error.message);
      }
    }
    try{
      localStorage.removeItem(gStoreKey('ex_'+gid));
      localStorage.removeItem(gStoreKey('bud_'+gid));
    }catch(e){}
    myGroups = myGroups.filter(g => g.id !== gid);
    if(activeGroupId === gid){ activeGroupId = null; grpEx = []; }
    flash('Đã xóa nhóm thành công!');
    render();
  }, 'Xóa nhóm');
}

async function loadAll(){
  const from=mAdd(-11).key+'-01';
  try {
    await ensureUserProfile();
    await loadGroups();
    const expQuery=sb.from('expenses').select('*, expense_items(*)').eq('user_id',uid).gte('spent_on',from).order('spent_on',{ascending:false}).order('created_at',{ascending:false});
    const[pr,bu,exs,nt]=await Promise.all([sb.from('profiles').select('*').maybeSingle(),sb.from('budgets').select('*'),expQuery,sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(30)]);
    
    if(pr.error) console.warn('Lỗi profiles:', pr.error);
    if(bu.error) console.warn('Lỗi budgets:', bu.error);
    if(exs.error) console.warn('Lỗi expenses:', exs.error);
    if(nt.error) console.warn('Lỗi notifications:', nt.error);

    if(pr.data){
      thr=pr.data.alert_threshold || 80;
      opts=Object.assign({budget:true,weekly:true,over:true},pr.data.options);
      scanned=pr.data.scanned || 0;
      if(!cleanName(userName) && cleanName(pr.data.full_name)){
        userName=cleanName(pr.data.full_name);
      }
    } else {
      await safeDb(()=>sb.from('profiles').insert({user_id:uid,full_name:cleanName(userName)||null}));
    }
    
    if(bu.data && bu.data.length) {
      budSeeded=true;
      cats.splice(0,cats.length,...bu.data.map(b=>mkCat(b.category,+b.amount)).sort((x,y)=>(DORD.indexOf(x.n)+1||99)-(DORD.indexOf(y.n)+1||99)));
    } else {
      budSeeded=false;
    }
    
    if(exs.data) {
      ex.splice(0,ex.length,...exs.data.map(r=>{
        const it=(r.expense_items||[]).map(i=>({id:i.id,n:i.name,c:i.category,a:+i.amount}));
        const e={id:r.id,uid:r.user_id,d:r.spent_on,s:r.shop,c:r.category,a:+r.amount,edits:r.edit_count||0,ts:r.created_at?new Date(r.created_at).getTime():0};
        if(it.length)e.items=it;
        return e;
      }));
    }
    if(activeGroupId) await loadGroupData(activeGroupId);
    
    if(nt.data) {
      const cleanNt=m=>String(m||'').replace(/\(\d+(?:\.\d+)?e\+\d+%\)/gi,'(>9.999%)');
      nts.splice(0,nts.length,...nt.data.map(n=>({t:cleanNt(n.message),d:new Date(n.created_at).toLocaleDateString('vi-VN'),c:n.color})));
      unread=nt.data.filter(n=>!n.read).length;
    }
  } catch(e) {
    console.error('Lỗi tải dữ liệu:', e);
  }
}

function tr(s){const m=s.match(/^(\s*)([\s\S]*?)(\s*)$/),c=m[2];if(!c)return s;if(D[c]!==undefined)return m[1]+D[c]+m[3];for(const [r,f] of P){const x=c.match(r);if(x)return m[1]+f(...x)+m[3]}return s}

function xl(root){if(lang!=='en'||!root)return;if(root.nodeType===1&&root.closest&&root.closest('[data-no-xl]'))return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(n.parentElement&&n.parentElement.closest('[data-no-xl]'))continue;const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}
 root.querySelectorAll('[placeholder],[aria-label],[alt]').forEach(e=>AT.forEach(a=>{const o=e.getAttribute(a);if(o){const v=tr(o);if(v!==o)e.setAttribute(a,v)}}))}

function setLang(l){lang=l;try{localStorage.setItem('sw-lang',l)}catch(e){}document.documentElement.lang=l;$('#root').innerHTML='';$('#lm').innerHTML=LM0;$('#gear').setAttribute('aria-label','Cài đặt');$('#bell').setAttribute('aria-label','Thông báo');render();xl(document.body);mark();fillSet();menu(false)}
addEventListener('click',e=>{if(!e.target.closest('#gear,#lm,#bell,#np')){menu(false);bellMenu(false)}});addEventListener('keydown',e=>{if(e.key==='Escape'){menu(false);bellMenu(false);const a=$('#ask');if(a)a.remove()}});

function mbNav(){const on=auth&&!rec,b=$('#mnav'),h=$('#mbar');b.hidden=h.hidden=!on;$('#msh').hidden=true;if(!on)return;const k=cur();

 b.innerHTML=t('dashboard',ICO.home,'Tổng quan')+t('history',ICO.hist,'Lịch sử')+`<button class="fab${k==='scan'||k==='expenses'?' on':''}" aria-label="Thêm khoản chi" onclick="mbAdd()"><span>${ICO.plus}</span></button>`+t('budget',ICO.pie,'Ngân sách')+`<button${k==='report'||k==='groups'?' class="on"':''} onclick="mbMore()">${ICO.more}<span>Mục khác</span></button>`}
function mbSheet(title,items){menu(false);bellMenu(false);const m=$('#msh');m.innerHTML=`<div class="mu lh">${title}</div>`+items.map(([ic,lb,go])=>`<button class="lo" onclick="${go}"><span style="display:flex;gap:12px;align-items:center">${ic}<span>${lb}</span></span></button>`).join('');m.hidden=false}

let mbDip=null;const mbStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const mbIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function mbInst(){const b=$('#inst');if(b)b.hidden=mbStandalone()||!(mbDip||mbIOS)}
function mbInstall(){menu(false);if(mbDip){mbDip.prompt();mbDip.userChoice.finally(()=>{mbDip=null;mbInst()})}else ask(T('Trên iPhone: mở bằng Safari, bấm nút Chia sẻ rồi chọn "Thêm vào Màn hình chính".'),()=>{},T('Đã hiểu'))}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();mbDip=e;mbInst()});
addEventListener('appinstalled',()=>{mbDip=null;mbInst()});
const mbSync=()=>document.body.classList.toggle('sheet',innerWidth<=860&&!($('#lm').hidden&&$('#np').hidden&&$('#msh').hidden));
['#lm','#np','#msh'].forEach(q=>new MutationObserver(mbSync).observe($(q),{attributes:true,attributeFilter:['hidden']}));

addEventListener('click',e=>{if(!e.target.closest('#msh,#mnav'))mbClose()});
addEventListener('keydown',e=>{if(e.key==='Escape')mbClose()});
const mbField='input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=button]),select,textarea';let mbT;
addEventListener('focusin',e=>{if(innerWidth<=860&&e.target.matches&&e.target.matches(mbField)){clearTimeout(mbT);document.body.classList.add('kb')}});
addEventListener('focusout',()=>{clearTimeout(mbT);mbT=setTimeout(()=>{if(!(document.activeElement&&document.activeElement.matches&&document.activeElement.matches(mbField)))document.body.classList.remove('kb')},80)});
mbInst();
addEventListener('hashchange',render);boot().then(()=>{xl(document.body);mark()});
